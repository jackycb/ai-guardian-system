; 通用配置
[common]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_build.flash_mode = qio
board_build.psram_type = opi
monitor_speed = 115200
lib_deps =
    esp32-camera
    bblanchon/ArduinoJson@^7

; 开发环境（HTTP，调试日志）—— 默认
[env:xiao_esp32s3]
extends = common
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; 生产环境（HTTPS，精简日志）
[env:xiao_esp32s3_prod]
extends = common
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DUSE_HTTPS
